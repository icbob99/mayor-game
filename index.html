<!DOCTYPE html>
<html lang="en" id="html-root">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayor: Chronicles of Embezzlement</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Top bar: language switcher and Tamagotchi-style stats -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-3xl mx-auto flex flex-wrap md:flex-nowrap justify-between items-center gap-2 mb-3">
            <h1 class="text-sm font-bold text-slate-400">🏛️ Mayor: Chronicles of Embezzlement</h1>
            <!-- Language switcher -->
            <div id="lang-selector" class="relative text-xs">
                <button id="lang-toggle" type="button" onclick="toggleLanguageMenu()"
                    class="flex items-center gap-2 p-1.5 rounded font-bold bg-slate-700 hover:bg-slate-600 text-white transition"
                    title="Change language" aria-label="Change language" aria-haspopup="listbox" aria-expanded="false">
                    <img id="lang-flag" src="assets/flags/gb.svg" alt="English" class="w-6 h-4 object-cover rounded-sm">
                    <span id="lang-label">English</span>
                    <span aria-hidden="true">▾</span>
                </button>
                <div id="lang-menu" class="hidden absolute right-0 mt-1 min-w-32 p-1 rounded-lg bg-slate-700 border border-slate-600 shadow-lg z-30"
                    role="listbox" aria-label="Languages"></div>
            </div>
            <button id="btn-audio" onclick="toggleAudio()"
                class="px-3 py-1 rounded font-bold bg-slate-700 hover:bg-slate-600 text-white transition text-xs flex items-center gap-1">
                🔊 <span id="audio-status">ON</span>
            </button>
            <button id="btn-shop" onclick="toggleShop(true)"
                class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 px-3 rounded-lg text-sm transition flex items-center gap-1.5 cursor-pointer shadow">
                <span>🛒</span>
                <span id="label-btn-shop"></span>
            </button>
            <button id="btn-achievements" onclick="toggleAchievements(true)"
                class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-1.5 px-3 rounded-lg text-sm transition flex items-center gap-1.5 cursor-pointer shadow"
                aria-label="Achievements">🏆</button>
        </div>

        <div class="max-w-2xl mx-auto grid grid-cols-2 md:grid-cols-5 gap-2 text-center text-sm">
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-money" class="text-slate-400 text-xs">Money / Offshore</div>
                <div id="stat-money" class="text-green-400 font-bold text-lg">1.5M ₪</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-wife" class="text-slate-400 text-xs">Wife's Appetite</div>
                <div id="stat-wife" class="text-pink-400 font-bold text-lg">50%</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-threat" class="text-slate-400 text-xs">Threat (Lahav 433)</div>
                <div id="stat-threat" class="text-yellow-400 font-bold text-lg">15%</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-health" class="text-slate-400 text-xs">Mayor's Health</div>
                <div id="stat-health" class="text-red-400 font-bold text-lg">90%</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-rating" class="text-slate-400 text-xs"></div>
                <div id="stat-rating" class="text-blue-400 font-bold text-lg">50%</div>
            </div>
        </div>
    </header>

    <section class="max-w-3xl w-full mx-auto px-4 pt-3 flex flex-wrap items-center justify-center gap-3">
        <span id="auth-account" class="font-bold"></span>
        <button id="btn-login" onclick="openAuth('login')" class="px-3 py-2 rounded bg-indigo-600"></button>
        <button id="btn-register" onclick="openAuth('register')" class="px-3 py-2 rounded bg-slate-700"></button>
        <button id="btn-become-guest" onclick="becomeGuest()" hidden class="px-3 py-2 rounded bg-slate-700"></button>
    </section>
    <div id="auth-notice" hidden role="status" class="max-w-xl mx-auto p-3 text-center text-amber-300">
        <span id="auth-notice-text"></span>
        <button id="btn-auth-continue" onclick="AccountSession.activity()" class="underline ms-2"></button>
    </div>

    <dialog id="auth-dialog" class="bg-slate-800 text-white rounded-2xl p-6 w-full max-w-sm backdrop:bg-black/70"
        oncancel="if (authFormBusy) event.preventDefault()">
        <form id="auth-form" onsubmit="submitAuth(event)" class="space-y-4">
            <h2 id="auth-title" class="text-xl font-bold"></h2>
            <label class="block"><span id="auth-nickname-label"></span>
                <input id="auth-nickname" name="nickname" autocomplete="username" required maxlength="128" class="block w-full mt-1 rounded bg-slate-700 p-2">
            </label>
            <label class="block"><span id="auth-password-label"></span>
                <input id="auth-password" name="password" type="password" autocomplete="current-password" required maxlength="1024" class="block w-full mt-1 rounded bg-slate-700 p-2">
            </label>
            <p id="auth-error" role="alert" class="text-red-300"></p>
            <div class="flex gap-3">
                <button id="auth-submit" type="submit" class="rounded bg-indigo-600 px-4 py-2"></button>
                <button id="auth-cancel" type="button" onclick="document.getElementById('auth-dialog').close()" class="rounded bg-slate-700 px-4 py-2"></button>
            </div>
        </form>
    </dialog>
    <dialog id="auth-invite" class="bg-slate-800 text-white rounded-2xl p-6 w-full max-w-sm backdrop:bg-black/70">
        <p id="auth-invite-text" class="mb-4"></p>
        <button id="auth-invite-yes" onclick="openAuth('register')" class="rounded bg-indigo-600 px-4 py-2"></button>
        <button id="auth-invite-no" onclick="document.getElementById('auth-invite').close()" class="rounded bg-slate-700 px-4 py-2"></button>
    </dialog>

    <div id="save-sync-notice" hidden role="status" class="max-w-xl mx-auto p-3 text-center text-amber-300">
        <span id="save-sync-notice-text"></span>
        <button id="save-sync-review" onclick="showSaveSync()" class="underline ms-2"></button>
    </div>
    <dialog id="save-sync-dialog" class="bg-slate-800 text-white rounded-2xl p-6 w-full max-w-lg backdrop:bg-black/70"
        oncancel="if (saveSyncBusy) event.preventDefault()" onclose="updateSaveSyncUI()">
        <h2 id="save-sync-title" class="text-xl font-bold mb-3"></h2>
        <p id="save-sync-description" class="mb-4"></p>
        <div class="grid gap-3 sm:grid-cols-2 mb-4">
            <div id="save-sync-local-card" class="rounded bg-slate-700 p-3">
                <h3 id="save-sync-local-title" class="font-bold"></h3>
                <p id="save-sync-local-summary" class="whitespace-pre-line my-2"></p>
                <button id="save-sync-local" onclick="resolveSaveSync('local')" class="rounded bg-indigo-600 px-3 py-2"></button>
            </div>
            <div id="save-sync-cloud-card" class="rounded bg-slate-700 p-3">
                <h3 id="save-sync-cloud-title" class="font-bold"></h3>
                <p id="save-sync-cloud-summary" class="whitespace-pre-line my-2"></p>
                <button id="save-sync-cloud" onclick="resolveSaveSync('cloud')" class="rounded bg-indigo-600 px-3 py-2"></button>
            </div>
        </div>
        <p id="save-sync-error" role="alert" class="text-red-300 mb-3"></p>
        <button id="save-sync-confirm" onclick="resolveSaveSync()" class="rounded bg-indigo-600 px-4 py-2"></button>
        <button id="save-sync-cancel" onclick="document.getElementById('save-sync-dialog').close()" class="rounded bg-slate-700 px-4 py-2"></button>
    </dialog>

    <!-- Main game block: Day card -->
    <main class="max-w-xl w-full mx-auto p-4 flex-1 flex flex-col justify-center">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold" id="day-counter">
                    Day 1
                </div>
                <!-- Avatar block -->
                <div id="event-avatar"
                    class="text-3xl bg-slate-700/60 p-2 rounded-xl border border-slate-600/50 shadow-inner">
                    🏛️
                </div>
            </div>

            <h2 id="event-title" class="text-xl font-bold mb-3 text-white text-start"></h2>
            <p id="event-desc" class="text-slate-300 mb-6 leading-relaxed text-start"></p>

            <div id="choices-container" class="space-y-3">
                <!-- Buttons are generated dynamically through JS -->
            </div>
        </div>
    </main>

    <!-- GameOver Modal / Overlay -->
    <div id="game-over-screen"
        class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div
            class="bg-slate-800 border border-slate-700 max-w-md w-full rounded-2xl p-6 text-center shadow-2xl relative overflow-hidden">
            <div id="game-over-icon" class="text-6xl mb-4">🚨</div>
            <h2 id="game-over-title" class="text-2xl font-bold mb-2 text-white"></h2>
            <p id="game-over-reason" class="text-slate-300 mb-6 text-sm leading-relaxed"></p>

            <!-- Stats Box -->
            <div class="bg-slate-900/80 rounded-xl p-4 mb-6 border border-slate-700/50 space-y-2 text-left">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400" id="label-stat-days"></span>
                    <span id="end-stat-days" class="font-bold text-white">0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400" id="label-stat-offshore"></span>
                    <span id="end-stat-money" class="font-bold text-emerald-400">0 ₪</span>
                </div>
                <hr class="border-slate-800 my-2">
                <div class="flex justify-between text-sm items-center">
                    <span class="text-slate-400" id="label-stat-title"></span>
                    <span id="end-stat-title" class="font-bold text-amber-400 text-right">---</span>
                </div>
            </div>

            <button id="btn-restart" onclick="resetGame()"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl transition cursor-pointer shadow-lg">

            </button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" role="dialog" aria-modal="true" aria-labelledby="shop-title"
        onclick="if (event.target === this) toggleShop(false)"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 max-w-lg w-full rounded-2xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="shop-title" class="text-xl font-bold text-white flex items-center gap-2">🛒 </h3>
                <button id="shop-dismiss-btn" onclick="toggleShop(false)" aria-label="Close shop"
                    class="text-slate-400 hover:text-white text-xl font-bold p-1 cursor-pointer">✕</button>
            </div>

            <div id="shop-items-container" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Perks are generated dynamically -->
            </div>

            <div class="mt-6 pt-3 border-t border-slate-700 flex justify-end">
                <button onclick="toggleShop(false)" id="shop-close-btn"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-5 rounded-xl transition cursor-pointer">

                </button>
            </div>
        </div>
    </div>

    <!-- Achievements Modal -->
    <div id="achievements-modal" role="dialog" aria-modal="true" aria-labelledby="achievements-title"
        onclick="if (event.target === this) toggleAchievements(false)"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 max-w-md w-full rounded-2xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="achievements-title" class="text-xl font-bold text-white flex items-center gap-2">🏆 </h3>
                <button id="achievements-dismiss-btn" onclick="toggleAchievements(false)" aria-label="Close achievements"
                    class="text-slate-400 hover:text-white text-xl font-bold p-1 cursor-pointer">✕</button>
            </div>
            <div id="achievements-list" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center p-4 text-xs text-slate-500 border-t border-slate-800">
        <div>Mayor: Chronicles of Embezzlement</div>
        <button id="btn-guest-stats" onclick="toggleGuestStats(true)"
            class="mt-2 inline-flex items-center gap-1 px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
            aria-label="Guest statistics">📜</button>
    </footer>

    <!-- Guest statistics modal -->
    <div id="guest-stats-modal" role="dialog" aria-modal="true" aria-labelledby="guest-stats-title"
        onclick="if (event.target === this) toggleGuestStats(false)"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 max-w-md w-full rounded-2xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="guest-stats-title" class="text-xl font-bold text-white">📜 Guest statistics</h3>
                <button id="guest-stats-dismiss-btn" onclick="toggleGuestStats(false)" aria-label="Close statistics"
                    class="text-slate-400 hover:text-white text-xl font-bold p-1 cursor-pointer">✕</button>
            </div>
            <div class="space-y-3 text-sm">
                <div class="flex justify-between"><span id="guest-stats-games-label" class="text-slate-400">Games played</span><strong id="guest-stats-games">0</strong></div>
                <div class="flex justify-between"><span id="guest-stats-money-label" class="text-slate-400">Maximum money</span><strong id="guest-stats-money" class="text-emerald-400">0 ₪</strong></div>
                <div>
                    <div id="guest-stats-achievements-label" class="text-slate-400 mb-2">Achievements</div>
                    <div id="guest-stats-achievements" class="space-y-2"></div>
                </div>
            </div>
            <div class="mt-6 pt-3 border-t border-slate-700 flex justify-end">
                <button onclick="toggleGuestStats(false)" id="guest-stats-close-btn"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-5 rounded-xl transition cursor-pointer">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Load data and game logic -->
    <script src="app/ui/audio.js"></script>
    <script src="app/infrastructure/data-proxy.js"></script>
    <script src="app/infrastructure/browser-session.js"></script>
    <script src="app/data/dal.js"></script>
    <script src="app/data/guest-storage.js"></script>
    <script src="app/ui/language-utils.js"></script>
    <script src="app/game/guest-session.js"></script>
    <script src="app/game/mayor-save.js"></script>
    <script src="app/game/account-session.js"></script>
    <script src="app/game/game-state.js"></script>
    <script src="app/game/choice-order.js"></script>
    <script src="app/ui/language.js"></script>
    <script src="app/ui/auth.js"></script>
    <script src="app/ui/save-sync.js"></script>
    <script src="app/ui/ui.js"></script>
    <script src="app/game/shop.js"></script>
    <script src="app/game/achievements.js"></script>
    <script src="app/game/events.js"></script>
    <script src="app/game/game-over.js"></script>
    <script src="app/game/game.js"></script>
</body>

</html>
