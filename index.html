<!DOCTYPE html>
<html lang="en" id="html-root">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayor: Chronicles of Embezzlement</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Top bar: language switcher and Tamagotchi-style stats -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-xl mx-auto flex justify-between items-center mb-3">
            <h1 class="text-sm font-bold text-slate-400">🏛️ Mayor: Chronicles of Embezzlement</h1>
            <!-- Language switcher -->
            <div id="lang-selector" class="flex gap-2 text-xs">
                <button id="btn-ru" onclick="setLang('ru')"
                    class="px-3 py-1 rounded font-bold bg-indigo-600 text-white transition">RU</button>
                <button id="btn-he" onclick="setLang('he')"
                    class="px-3 py-1 rounded font-bold bg-slate-700 hover:bg-slate-600 text-white transition">HE</button>
                <button id="btn-en" onclick="setLang('en')"
                    class="px-3 py-1 rounded font-bold bg-slate-700 hover:bg-slate-600 text-white transition">EN</button>
            </div>
            <button id="btn-audio" onclick="toggleAudio()"
                class="px-3 py-1 rounded font-bold bg-slate-700 hover:bg-slate-600 text-white transition text-xs flex items-center gap-1">
                🔊 <span id="audio-status">ON</span>
            </button>
        </div>

        <div class="max-w-2xl mx-auto grid grid-cols-2 md:grid-cols-5 gap-2 text-center text-sm">
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-money" class="text-slate-400 text-xs">Money / Offshore</div>
                <div id="stat-money" class="text-green-400 font-bold text-lg">1.5M ₪</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-wife" class="text-slate-400 text-xs">Wife's Appetite</div>
                <div id="stat-wife" class="text-pink-400 font-bold text-lg">50%</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-threat" class="text-slate-400 text-xs">Threat (Lahav 433)</div>
                <div id="stat-threat" class="text-yellow-400 font-bold text-lg">15%</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-health" class="text-slate-400 text-xs">Mayor's Health</div>
                <div id="stat-health" class="text-red-400 font-bold text-lg">90%</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded-lg">
                <div id="label-rating" class="text-slate-400 text-xs">Любовь народа</div>
                <div id="stat-rating" class="text-blue-400 font-bold text-lg">50%</div>
            </div>
        </div>
    </header>

    <!-- Main game block: Day card -->
    <main class="max-w-xl w-full mx-auto p-4 flex-1 flex flex-col justify-center">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold" id="day-counter">
                    Day 1
                </div>
                <!-- Блок Аватара -->
                <div id="event-avatar"
                    class="text-3xl bg-slate-700/60 p-2 rounded-xl border border-slate-600/50 shadow-inner">
                    🏛️
                </div>
            </div>

            <h2 id="event-title" class="text-xl font-bold mb-3 text-white text-start"></h2>
            <p id="event-desc" class="text-slate-300 mb-6 leading-relaxed text-start"></p>

            <div id="choices-container" class="space-y-3">
                <!-- Buttons are generated dynamically through JS -->
            </div>
        </div>
    </main>

    <!-- GameOver Modal / Overlay -->
    <div id="game-over-screen"
        class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div
            class="bg-slate-800 border border-slate-700 max-w-md w-full rounded-2xl p-6 text-center shadow-2xl relative overflow-hidden">
            <div id="game-over-icon" class="text-6xl mb-4">🚨</div>
            <h2 id="game-over-title" class="text-2xl font-bold mb-2 text-white">Игра окончена</h2>
            <p id="game-over-reason" class="text-slate-300 mb-6 text-sm leading-relaxed"></p>

            <!-- Stats Box -->
            <div class="bg-slate-900/80 rounded-xl p-4 mb-6 border border-slate-700/50 space-y-2 text-left">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400" id="label-stat-days">Прожито дней:</span>
                    <span id="end-stat-days" class="font-bold text-white">0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400" id="label-stat-offshore">Офшоры:</span>
                    <span id="end-stat-money" class="font-bold text-emerald-400">0 ₪</span>
                </div>
                <hr class="border-slate-800 my-2">
                <div class="flex justify-between text-sm items-center">
                    <span class="text-slate-400" id="label-stat-title">Финальный титул:</span>
                    <span id="end-stat-title" class="font-bold text-amber-400 text-right">---</span>
                </div>
            </div>

            <button id="btn-restart" onclick="resetGame()"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl transition cursor-pointer shadow-lg">
                Начать новый срок
            </button>
        </div>
    </div>
    <!-- Footer -->
    <footer class="text-center p-4 text-xs text-slate-500 border-t border-slate-800">
        Mayor: Chronicles of Embezzlement &bull; i18n Edition
    </footer>

    <!-- Подключаем данные и игровую логику -->
    <script src="app/audio.js"></script>
    <script src="app/gameData.js"></script>
    <script src="app/game.js"></script>
</body>

</html>
