<!DOCTYPE html>
<html lang="en" id="html-root">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayor: Chronicles of Embezzlement</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- System controls and city indicators -->
    <header id="game-header" class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div id="game-nav" class="max-w-5xl mx-auto flex justify-between items-center gap-2 mb-3">
            <h1 class="text-sm font-bold text-slate-400">🏛️ <span id="game-title">Mayor: Chronicles of Embezzlement</span><span id="game-title-short">Mayor</span></h1>
            <div class="system-actions">
            <button id="btn-achievements"
                class="bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg transition"
                aria-label="Achievements">🏆</button>
            <button id="btn-audio" aria-haspopup="dialog" aria-controls="audio-modal"
                class="rounded-lg font-bold bg-slate-700 hover:bg-slate-600 text-white transition" aria-expanded="false">
                <span id="audio-icon" aria-hidden="true">🔊</span><span id="audio-status" class="sr-only"></span>
            </button>
            <!-- Language switcher -->
            <div id="lang-selector" class="relative text-xs">
                <button id="lang-toggle" type="button"
                    class="flex items-center gap-2 p-1.5 rounded font-bold bg-slate-700 hover:bg-slate-600 text-white transition"
                    title="Change language" aria-label="Change language" aria-haspopup="listbox" aria-expanded="false">
                    <img id="lang-flag" src="assets/flags/gb.svg" alt="English" class="w-6 h-4 object-cover rounded-sm">
                    <span id="lang-label">English</span>
                    <span aria-hidden="true">▾</span>
                </button>
                <div id="lang-menu" class="hidden absolute right-0 mt-1 min-w-32 p-1 rounded-lg bg-slate-700 border border-slate-600 shadow-lg z-30"
                    role="listbox" aria-label="Languages"></div>
            </div>
            </div>
        </div>

        <div id="game-stats" class="max-w-2xl mx-auto text-center text-sm">
            <div class="money-row">
            <div class="money-tile bg-slate-700/50 p-2 rounded-lg">
                <div id="label-money" class="text-slate-400 text-xs">Money / Offshore</div>
                <div class="money-value"><span aria-hidden="true">💰</span><bdi id="stat-money" class="text-green-400 font-bold">1.5M ₪</bdi></div>
            </div>
            <button id="btn-shop"
                class="bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-sm transition shadow">
                <span aria-hidden="true">🛒</span> <span id="label-btn-shop"></span>
            </button>
            </div>
            <div id="secondary-stats" class="grid grid-cols-4 gap-2">
                <button type="button" class="stat-tile" aria-labelledby="label-rating" aria-describedby="stat-rating">
                    <span class="stat-caption"><span aria-hidden="true">🗳️</span><span id="label-rating" class="stat-label"></span></span>
                    <bdi id="stat-rating" class="text-blue-400 font-bold">50%</bdi>
                    <span class="stat-tooltip" aria-hidden="true"></span>
                </button>
                <button type="button" class="stat-tile" aria-labelledby="label-health" aria-describedby="stat-health">
                    <span class="stat-caption"><span aria-hidden="true">❤️</span><span id="label-health" class="stat-label">Mayor's Health</span></span>
                    <bdi id="stat-health" class="text-red-400 font-bold">90%</bdi>
                    <span class="stat-tooltip" aria-hidden="true"></span>
                </button>
                <button type="button" class="stat-tile" aria-labelledby="label-threat" aria-describedby="stat-threat">
                    <span class="stat-caption"><span aria-hidden="true">🚨</span><span id="label-threat" class="stat-label">Threat</span></span>
                    <bdi id="stat-threat" class="text-yellow-400 font-bold">15%</bdi>
                    <span class="stat-tooltip" aria-hidden="true"></span>
                </button>
                <button type="button" class="stat-tile" aria-labelledby="label-wife" aria-describedby="stat-wife">
                    <span class="stat-caption"><span aria-hidden="true">👠</span><span id="label-wife" class="stat-label">Wife's Appetite</span></span>
                    <bdi id="stat-wife" class="text-pink-400 font-bold">50%</bdi>
                    <span class="stat-tooltip" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </header>

    <section id="party-controls">
        <details id="account-controls">
            <summary id="profile-toggle" class="bg-slate-700 hover:bg-slate-600 rounded-lg">
                <span aria-hidden="true">👤</span><bdi id="auth-account" class="font-bold"></bdi><span aria-hidden="true">▾</span>
            </summary>
            <div id="profile-menu" class="bg-slate-800 border border-slate-600 rounded-lg shadow-xl">
                <button id="btn-login" class="px-3 py-2 rounded bg-indigo-600"></button>
                <button id="btn-register" class="px-3 py-2 rounded bg-slate-700"></button>
                <button id="btn-become-guest" hidden class="px-3 py-2 rounded bg-slate-700"></button>
            </div>
        </details>
        <button id="btn-difficulty" aria-haspopup="dialog"
            class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg"></button>
        <button id="btn-mode" aria-haspopup="dialog"
            class="bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold"></button>
    </section>
    <div id="auth-notice" hidden role="status" class="max-w-xl mx-auto p-3 text-center text-amber-300">
        <span id="auth-notice-text"></span>
        <button id="btn-auth-continue" class="underline ms-2"></button>
    </div>

    <dialog id="auth-dialog" class="bg-slate-800 text-white rounded-2xl p-6 w-full max-w-sm backdrop:bg-black/70">
        <form id="auth-form" class="space-y-4">
            <h2 id="auth-title" class="text-xl font-bold"></h2>
            <label class="block"><span id="auth-nickname-label"></span>
                <input id="auth-nickname" name="nickname" autocomplete="username" required maxlength="128" class="block w-full mt-1 rounded bg-slate-700 p-2">
            </label>
            <label class="block"><span id="auth-password-label"></span>
                <input id="auth-password" name="password" type="password" autocomplete="current-password" required maxlength="1024" class="block w-full mt-1 rounded bg-slate-700 p-2">
            </label>
            <p id="auth-error" role="alert" class="text-red-300"></p>
            <div class="flex gap-3">
                <button id="auth-submit" type="submit" class="rounded bg-indigo-600 px-4 py-2"></button>
                <button id="auth-cancel" type="button" class="rounded bg-slate-700 px-4 py-2"></button>
            </div>
        </form>
    </dialog>
    <dialog id="auth-invite" class="bg-slate-800 text-white rounded-2xl p-6 w-full max-w-sm backdrop:bg-black/70">
        <p id="auth-invite-text" class="mb-4"></p>
        <button id="auth-invite-yes" class="rounded bg-indigo-600 px-4 py-2"></button>
        <button id="auth-invite-no" class="rounded bg-slate-700 px-4 py-2"></button>
    </dialog>

    <div id="save-sync-notice" hidden role="status" class="max-w-xl mx-auto p-3 text-center text-amber-300">
        <span id="save-sync-notice-text"></span>
        <button id="save-sync-review" class="underline ms-2"></button>
    </div>
    <dialog id="save-sync-dialog" class="bg-slate-800 text-white rounded-2xl p-6 w-full max-w-lg backdrop:bg-black/70">
        <h2 id="save-sync-title" class="text-xl font-bold mb-3"></h2>
        <p id="save-sync-description" class="mb-4"></p>
        <div class="grid gap-3 sm:grid-cols-2 mb-4">
            <div id="save-sync-local-card" class="rounded bg-slate-700 p-3">
                <h3 id="save-sync-local-title" class="font-bold"></h3>
                <p id="save-sync-local-summary" class="whitespace-pre-line my-2"></p>
                <button id="save-sync-local" class="rounded bg-indigo-600 px-3 py-2"></button>
            </div>
            <div id="save-sync-cloud-card" class="rounded bg-slate-700 p-3">
                <h3 id="save-sync-cloud-title" class="font-bold"></h3>
                <p id="save-sync-cloud-summary" class="whitespace-pre-line my-2"></p>
                <button id="save-sync-cloud" class="rounded bg-indigo-600 px-3 py-2"></button>
            </div>
        </div>
        <p id="save-sync-error" role="alert" class="text-red-300 mb-3"></p>
        <button id="save-sync-confirm" class="rounded bg-indigo-600 px-4 py-2"></button>
        <button id="save-sync-cancel" class="rounded bg-slate-700 px-4 py-2"></button>
    </dialog>

    <button id="daily-reminder" hidden class="mx-auto text-sm text-indigo-300 underline"></button>
    <!-- Main game block: Day card -->
    <main class="max-w-xl w-full mx-auto p-4">
        <div id="event-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold" id="day-counter">
                    Day 1
                </div>
                <span id="daily-turns" hidden class="text-xs text-slate-300"></span>
                <button id="btn-resign" class="text-xs text-slate-300 hover:text-white px-2 py-1 rounded border border-slate-600"></button>
                <!-- Avatar block -->
                <div id="event-avatar"
                    class="text-3xl bg-slate-700/60 p-2 rounded-xl border border-slate-600/50 shadow-inner">
                    🏛️
                </div>
            </div>

            <div id="blitz-timer" hidden class="h-1 bg-slate-700 mb-3 overflow-hidden rounded" aria-hidden="true"><div id="blitz-progress" class="h-full bg-indigo-400"></div></div>
            <h2 id="event-title" class="text-xl font-bold mb-3 text-white text-start"></h2>
            <p id="event-desc" class="text-slate-300 mb-6 leading-relaxed text-start"></p>

            <p id="daily-closed" hidden role="status" class="mb-3 text-amber-300 text-sm"></p>
            <div id="choices-container" class="space-y-3">
                <!-- Buttons are generated dynamically through JS -->
            </div>
        </div>
    </main>

    <!-- GameOver Modal / Overlay -->
    <div id="game-over-screen" role="dialog" aria-modal="true" aria-labelledby="game-over-title"
        class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div id="game-over-dialog"
            class="bg-slate-800 border border-slate-700 w-full max-h-full overflow-y-auto rounded-2xl p-6 text-center shadow-2xl relative">
            <div id="game-over-summary">
                <div id="game-over-icon" class="text-6xl mb-4">🚨</div>
                <h2 id="game-over-title" class="text-2xl font-bold mb-2 text-white"></h2>
                <p id="game-over-reason" class="text-slate-300 mb-6 text-sm leading-relaxed"></p>

                <!-- Stats Box -->
                <div class="bg-slate-900/80 rounded-xl p-4 mb-6 border border-slate-700/50 space-y-2 text-start">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400" id="label-stat-days"></span>
                        <span id="end-stat-days" class="font-bold text-white">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400" id="label-stat-offshore"></span>
                        <span id="end-stat-money" class="font-bold text-emerald-400">0 ₪</span>
                    </div>
                    <hr class="border-slate-800 my-2">
                    <div class="flex justify-between gap-3 text-sm">
                        <span class="text-slate-400" id="label-stat-score"></span>
                        <span id="end-stat-score" class="font-bold text-amber-300"></span>
                    </div>
                    <p id="end-score-bonus" hidden class="text-xs text-amber-300"></p>
                    <p id="end-bonus-achievement" hidden class="text-sm font-bold text-purple-300"></p>
                    <div class="flex justify-between gap-3 text-sm items-center">
                        <span class="text-slate-400" id="label-stat-title"></span>
                        <span id="end-stat-title" class="font-bold text-amber-400 text-end min-w-0 break-words">---</span>
                    </div>
                </div>

            </div>
            <div id="newspaper-section" hidden>
                <p id="newspaper-status" role="status"></p>
                <img id="newspaper-preview" width="1200" height="630" hidden alt="">
                <div class="newspaper-actions">
                    <button id="btn-share-result" type="button" disabled class="bg-indigo-600 hover:bg-indigo-500"></button>
                    <button id="btn-download-newspaper" type="button" disabled class="bg-slate-700 hover:bg-slate-600"></button>
                </div>
                <p id="newspaper-toast" role="status" hidden></p>
            </div>
            <p id="daily-end-closed" hidden class="mb-3 text-amber-300 text-sm"></p>
            <button id="btn-end-mode" aria-haspopup="dialog"
                class="mb-3 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded-xl"></button>
            <button id="btn-end-difficulty" aria-haspopup="dialog"
                class="mb-3 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded-xl"></button>
            <button id="btn-restart"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl transition cursor-pointer shadow-lg">

            </button>
        </div>
    </div>

    <dialog id="audio-modal" aria-labelledby="audio-title"
        class="bg-slate-800 text-white rounded-2xl p-5 w-[calc(100%_-_2rem)] max-w-sm border border-slate-600 backdrop:bg-black/70">
        <div class="flex items-center justify-between gap-3 mb-5">
            <h2 id="audio-title" class="text-xl font-bold"></h2>
            <button id="audio-dismiss" type="button" class="text-2xl text-slate-400 hover:text-white">×</button>
        </div>
        <fieldset class="rounded-xl bg-slate-700/60 p-3 mb-4">
            <legend id="audio-music-label" class="font-bold px-1"></legend>
            <div class="flex items-center justify-between gap-3 mb-3">
                <button id="audio-music-toggle" type="button" class="rounded-lg bg-slate-600 px-3 py-2 text-sm font-bold"></button>
                <output id="audio-music-percent" for="audio-music-volume" class="tabular-nums"></output>
            </div>
            <input id="audio-music-volume" type="range" min="0" max="100" step="1" value="25" class="w-full accent-indigo-400">
        </fieldset>
        <fieldset class="rounded-xl bg-slate-700/60 p-3 mb-5">
            <legend id="audio-sfx-label" class="font-bold px-1"></legend>
            <div class="flex items-center justify-between gap-3 mb-3">
                <button id="audio-sfx-toggle" type="button" class="rounded-lg bg-slate-600 px-3 py-2 text-sm font-bold"></button>
                <output id="audio-sfx-percent" for="audio-sfx-volume" class="tabular-nums"></output>
            </div>
            <input id="audio-sfx-volume" type="range" min="0" max="100" step="1" value="70" class="w-full accent-indigo-400">
        </fieldset>
        <button id="audio-close" type="button" class="rounded-lg bg-indigo-600 px-4 py-2 font-bold hover:bg-indigo-500"></button>
    </dialog>

    <!-- Difficulty uses a native dialog for focus trapping, Escape and modal stacking. -->
    <dialog id="difficulty-modal" aria-labelledby="difficulty-title"
        class="fixed inset-0 m-0 w-full h-full max-w-none max-h-none bg-transparent text-white p-4 backdrop:bg-slate-950/80 backdrop:backdrop-blur-md">
        <div class="bg-slate-800 border border-slate-700 max-w-md w-full max-h-full overflow-y-auto rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h2 id="difficulty-title" class="text-xl font-bold"></h2>
                <button id="difficulty-dismiss" class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
            </div>
            <div id="difficulty-options" class="grid gap-3"></div>
        </div>
    </dialog>

    <dialog id="mode-modal" aria-labelledby="mode-title"
        class="fixed inset-0 m-0 w-full h-full max-w-none max-h-none bg-transparent text-white p-4 backdrop:bg-slate-950/80 backdrop:backdrop-blur-md">
        <div class="bg-slate-800 border border-slate-700 max-w-md w-full max-h-full overflow-y-auto rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h2 id="mode-title" class="text-xl font-bold"></h2>
                <button id="mode-dismiss" class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
            </div>
            <div id="mode-options" class="grid gap-3"></div>
        </div>
    </dialog>

    <!-- Shop Modal -->
    <div id="shop-modal" role="dialog" aria-modal="true" aria-labelledby="shop-title"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 max-w-lg w-full rounded-2xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="shop-title" class="text-xl font-bold text-white flex items-center gap-2">🛒 </h3>
                <button id="shop-dismiss-btn" aria-label="Close shop"
                    class="text-slate-400 hover:text-white text-xl font-bold p-1 cursor-pointer">✕</button>
            </div>

            <div id="shop-items-container" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Perks are generated dynamically -->
            </div>

            <div class="mt-6 pt-3 border-t border-slate-700 flex justify-end">
                <button id="shop-close-btn"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-5 rounded-xl transition cursor-pointer">

                </button>
            </div>
        </div>
    </div>

    <!-- Achievements Modal -->
    <div id="achievements-modal" role="dialog" aria-modal="true" aria-labelledby="achievements-title"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 max-w-md w-full rounded-2xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="achievements-title" class="text-xl font-bold text-white flex items-center gap-2">🏆 </h3>
                <button id="achievements-dismiss-btn" aria-label="Close achievements"
                    class="text-slate-400 hover:text-white text-xl font-bold p-1 cursor-pointer">✕</button>
            </div>
            <div id="achievements-list" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center p-4 text-xs text-slate-500 border-t border-slate-800">
        <div>Mayor: Chronicles of Embezzlement</div>
        <button id="btn-guest-stats"
            class="mt-2 inline-flex items-center gap-1 px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
            aria-label="Guest statistics">📜</button>
    </footer>

    <!-- Guest statistics modal -->
    <div id="guest-stats-modal" role="dialog" aria-modal="true" aria-labelledby="guest-stats-title"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 border border-slate-700 max-w-md w-full rounded-2xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 id="guest-stats-title" class="text-xl font-bold text-white">📜 Guest statistics</h3>
                <button id="guest-stats-dismiss-btn" aria-label="Close statistics"
                    class="text-slate-400 hover:text-white text-xl font-bold p-1 cursor-pointer">✕</button>
            </div>
            <div class="space-y-3 text-sm">
                <select id="stats-mode" class="bg-slate-700 rounded p-2 w-full"></select>
                <div class="flex justify-between"><span id="stats-resignations-label" class="text-slate-400"></span><strong id="stats-resignations">0</strong></div>
                <div class="flex justify-between"><span id="guest-stats-games-label" class="text-slate-400">Games played</span><strong id="guest-stats-games">0</strong></div>
                <div class="flex justify-between"><span id="guest-stats-money-label" class="text-slate-400">Maximum money</span><strong id="guest-stats-money" class="text-emerald-400">0 ₪</strong></div>
                <div>
                    <div id="guest-stats-achievements-label" class="text-slate-400 mb-2">Achievements</div>
                    <div id="guest-stats-achievements" class="space-y-2"></div>
                </div>
            </div>
            <div class="mt-6 pt-3 border-t border-slate-700 flex justify-end">
                <button id="guest-stats-close-btn"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-5 rounded-xl transition cursor-pointer">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Load data and game logic -->
    <script type="module" src="app/main.js"></script>
</body>

</html>
